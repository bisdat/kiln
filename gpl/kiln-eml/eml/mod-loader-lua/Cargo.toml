[package]
name = "mod-loader-lua"
edition.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
kfc.workspace = true
mod-loader = { package = "mod-loader-base", path = "../mod-loader-base" }

thiserror.workspace = true
walkdir.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
uuid.workspace = true
crc.workspace = true
# kiln-eml: byte-level archive ownership, separate from EML's performance cache.
sha2 = "0.10"
camino.workspace = true
bitflags.workspace = true

half.workspace = true
image.workspace = true

tracing.workspace = true

# kiln-eml: use the exact shared version after the binding differential, without changing EML bindings.
mlua.workspace = true
once_cell = "1.21.3"
ouroboros = "0.18.5"

# (the test lock/spawn gate)
[features]
# kiln-eml: test-only. Builds the test lock/spawn gate (src/test_gate.rs) and its holds around this crate's file locks,
# for kiln-eml's unit tests, whose [dev-dependencies] are the only place that enables it. Never a release feature: the
# shipped kiln-eml.dll is built without it (`cargo tree -e no-dev,features -p kiln-eml` does not list it).
test-gate = []
