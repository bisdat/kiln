name: Phase 1b chat completion candidate

on:
  push:
    branches:
      - feature/chat-tab-completion
    paths:
      - 'native/services/ui/**'
      - 'native/core/abi/services/kiln_ui.h'
      - 'managed/**'
      - 'launcher/**'
      - 'runtime/locales/**'
      - '.github/workflows/chat-completion-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-router:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build portable chat key/router regression tests
        run: |
          g++ -std=c++20 -O2 -g -Wall -Wextra -pthread \
            native/services/ui/tests/chat_keys_test.cpp -o /tmp/chat_keys_test
          /tmp/chat_keys_test
      - name: Verify appended chat ABI declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          abi = Path("native/core/abi/services/kiln_ui.h").read_text()
          native = Path("native/services/ui/ui.cpp").read_text()
          managed = Path("managed/services/Kiln.Ui/UiNative.cs").read_text()
          assert 'KilnResult(KILN_CALL* chat_completion)(KilnUiChatCompletion* io)' in abi
          assert 'offsetof(KilnUiApi, chat_completion) == 1016' in native
          assert 'sizeof(KilnUiApi) == 1024' in native
          assert 'sizeof(KilnUiChatCompletion) == 576' in native
          assert 'struct TableChat' in managed
          PY

  managed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Kiln.Ui and Kiln.Chat (API-contract gates)
        run: dotnet build managed/services/Kiln.Ui/Kiln.Ui.csproj -c Release
      - name: Run completion and existing command regression tests
        run: dotnet test managed/tests/Kiln.Api.Tests/Kiln.Api.Tests.csproj -c Release

  launcher-i18n:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install launcher dependencies
        run: bun install --frozen-lockfile
      - name: Verify all launcher translation keys
        run: bun run check:i18n
      - name: Type-check Settings page
        run: bun run typecheck
