name: Research 68 - Station Fill client probe

on:
  push:
    branches:
      - research/issue-68-station-fill-client
    paths:
      - 'mods/tests/station-fill-client-probe/**'
      - '.github/workflows/issue-68-station-fill-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-read-only-probe:
    name: Build read-only all-station probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack with matching Kiln dev.29.17 API 0.2.9 SDK
        run: KILN_PROBE_OUT="$GITHUB_WORKSPACE/artifacts" bash mods/tests/station-fill-client-probe/build-for-dev29.17.sh

      - name: Verify package and stage artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/station-fill-client-probe-0.1.1.zip
          unzip -l artifacts/station-fill-client-probe-0.1.1.zip

      - name: Upload probe package (no release)
        uses: actions/upload-artifact@v4
        with:
          name: station-fill-client-probe-0.1.1
          path: artifacts/station-fill-client-probe-0.1.1.zip
          if-no-files-found: error
