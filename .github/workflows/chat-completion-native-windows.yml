name: Phase 1b native Windows DLL and test overlay

on:
  push:
    branches:
      - dev/chat-tab-completion
    paths:
      - 'native/**'
      - 'managed/**'
      - 'runtime/locales/**'
      - 'tools/phase1b/**'
      - '.github/workflows/chat-completion-native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate the validated popup candidate from a superseded Windows job
  # that GitHub Actions left in progress despite cancel-in-progress.
  group: chat-win-phase1b-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure native Windows x64 project
        shell: pwsh
        run: cmake -S native -B build/chat-windows -G "Visual Studio 17 2022" -A x64 -T ClangCL
      - name: Build native Kiln UI, core and proxy DLLs
        shell: pwsh
        run: cmake --build build/chat-windows --config Release --target kiln-ui kiln-core kiln-proxy --parallel 3
      - name: Build matching managed Kiln.Ui and Kiln.Chat services
        shell: pwsh
        run: dotnet build managed/services/Kiln.Ui/Kiln.Ui.csproj -c Release -o build/chat-managed -v minimal
      - name: Assemble reversible Linux test overlay
        shell: pwsh
        run: |
          $root = "build/chat-overlay"
          New-Item -Force -ItemType Directory "$root/kiln/services", "$root/kiln/host", "$root/kiln/locales" | Out-Null
          $ui = Get-ChildItem build/chat-windows/bin/services -Recurse -File -Filter kiln-ui.dll | Select-Object -First 1
          $core = Get-ChildItem build/chat-windows/bin -Recurse -File -Filter kiln-core.dll | Select-Object -First 1
          $proxy = Get-ChildItem build/chat-windows/bin -Recurse -File -Filter dinput8.dll | Select-Object -First 1
          if (!$ui -or !$core -or !$proxy) { throw "Missing a required Windows native DLL" }
          if (!(Test-Path "build/chat-managed/Kiln.Chat.dll") -or !(Test-Path "build/chat-managed/Kiln.Ui.dll")) {
            throw "Missing matched managed Kiln.Chat.dll or Kiln.Ui.dll"
          }
          Copy-Item $ui.FullName "$root/kiln/services/kiln-ui.dll"
          Copy-Item "build/chat-managed/Kiln.Ui.dll" "$root/kiln/host/Kiln.Ui.dll"
          Copy-Item "build/chat-managed/Kiln.Chat.dll" "$root/kiln/host/Kiln.Chat.dll"
          Copy-Item "runtime/locales/en.json" "$root/kiln/locales/en.json"
          $texts = Get-Content -Raw "$root/kiln/locales/en.json" | ConvertFrom-Json
          if (-not $texts.chat.completion.title -or -not $texts.chat.completion.hint) {
            throw "Missing native chat-completion UI translation keys"
          }
          Copy-Item "tools/phase1b/README.md" "$root/README.md"
          Copy-Item "tools/phase1b/install-test-overlay.sh" "$root/install-test-overlay.sh"
          "git-commit=$(git rev-parse HEAD)" | Set-Content "$root/SOURCE_COMMIT.txt"
          "target-base=v0.2.0-dev.29.17" | Add-Content "$root/SOURCE_COMMIT.txt"
          Get-ChildItem "$root/kiln" -Recurse -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            Write-Host "$hash  $($_.FullName)"
          }
      - name: Syntax-check Linux installer
        shell: bash
        run: bash -n tools/phase1b/install-test-overlay.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-phase1b-test-overlay
          path: build/chat-overlay/
          if-no-files-found: error
          retention-days: 7

  installer-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check fail-closed installer backup/restore cycle with locale
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/phase1b/install-test-overlay.sh
          root=$(mktemp -d)
          trap 'rm -rf -- "$root"' EXIT
          mkdir -p "$root/overlay" "$root/game" "$root/original"
          cp tools/phase1b/install-test-overlay.sh "$root/overlay/"
          touch "$root/game/enshrouded.exe"
          files=(kiln/services/kiln-ui.dll kiln/host/Kiln.Ui.dll kiln/host/Kiln.Chat.dll kiln/locales/en.json)
          for file in "${files[@]}"; do
            mkdir -p "$root/overlay/$(dirname "$file")" "$root/game/$(dirname "$file")" "$root/original/$(dirname "$file")"
            printf 'original-content\n' > "$root/original/$file"
            cp "$root/original/$file" "$root/game/$file"
            printf 'new-content\n' > "$root/overlay/$file"
          done
          cp runtime/locales/en.json "$root/overlay/kiln/locales/en.json"
          bash "$root/overlay/install-test-overlay.sh" "$root/game" install
          for file in "${files[@]}"; do
            cmp "$root/overlay/$file" "$root/game/$file"
            cmp "$root/original/$file" "$root/game/kiln/data/phase1b-test-backup/$file"
          done
          if bash "$root/overlay/install-test-overlay.sh" "$root/game" install; then
            echo 'ERROR: repeated installation overwrote a prior backup' >&2
            exit 1
          fi
          bash "$root/overlay/install-test-overlay.sh" "$root/game" restore
          for file in "${files[@]}"; do
            cmp "$root/original/$file" "$root/game/$file"
          done
