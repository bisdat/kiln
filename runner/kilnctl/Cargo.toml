[package]
name = "kilnctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs Enshrouded dedicated servers with Kiln under Wine on Linux (SteamCMD, no Steam client)"
publish.workspace = true

# Windows: the exe's icon resource (build.rs, tools/winres/winres.rs); the same crate tauri-build uses
[build-dependencies]
embed-resource = "3"

[dependencies]
kiln-manage = { path = "../../crates/kiln-manage", features = ["server", "zip"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[features]
default = ["crucible", "sfi"]
# kilnctl pack publish: Pack Studio's publish to Crucible (https, the signed-index client)
crucible = ["kiln-manage/http"]
# Kiln mode (Kiln's interpreter for ShroudForge-format mods): kiln-manage's sfi-scan; kiln-mode activations run the archive
# inspector installed with each game's Kiln (main.rs; kiln_manage::profile::sfi::use_installed_inspector). On by
# default; whether a game runs it is kiln.json's choice and the core's gate list (native/core/gates/sfi.json).
sfi = ["kiln-manage/sfi-scan"]

[[test]]
name = "sfi_start"
required-features = ["sfi"]

# A member of the root workspace (../../Cargo.toml); release profile and version come from there.
